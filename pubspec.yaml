name: drhealth_app
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # ✅ HTTP for FastAPI backend communication
  http: ^1.2.2

  # ✅ Camera / Gallery (Mobile + Web)
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.4
  permission_handler: ^11.3.1

  # ✅ File Picker (for uploading PDFs, audio, etc.)
  file_picker: ^8.1.2

  # ✅ File storage utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # ✅ Share / export
  share_plus: ^10.0.2
  cross_file: ^0.3.4+1

  # ✅ State management
  provider: ^6.1.2

  # ✅ Local storage (Shared Preferences)
  shared_preferences: ^2.3.2

  # ✅ Local database (if needed later)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ✅ Payment integration
  razorpay_flutter: ^1.3.6

  # ✅ Notifications
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2

  # ✅ Icons
  cupertino_icons: ^1.0.8

  # ✅ Image utils / manipulation
  image: ^4.2.0

  # ✅ PDF generation (for report export)
  pdf: ^3.11.1

  # ✅ Optional (for Web PDF download/printing)
  printing: ^5.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ✅ Lints / Code quality
  flutter_lints: ^3.0.2

  # ✅ Code generation (for Hive)
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
