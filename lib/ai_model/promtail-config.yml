server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push   # Loki is accessible inside docker-compose

scrape_configs:
  - job_name: drhealth_fastapi_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi                 # ✅ simplified and matches Grafana query
          container: drhealth_fastapi  # ✅ identifies container
          __path__: /var/log/app/*.log # ✅ your FastAPI log files
